name: Gerar APK QualiInsp 3.0

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Compilar aplicativo Android
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Localizar projeto Android
        id: projeto
        shell: bash
        run: |
          SETTINGS=$(find . -type f \
            \( -name settings.gradle.kts -o -name settings.gradle \) \
            -not -path "*/.gradle/*" \
            -not -path "*/build/*" | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: settings.gradle não encontrado."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "Projeto encontrado em: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Validar estrutura do aplicativo
        working-directory: ${{ steps.projeto.outputs.dir }}
        shell: bash
        run: |
          if [ ! -f build.gradle.kts ] && [ ! -f build.gradle ]; then
            echo "ERRO: build.gradle não encontrado."
            exit 1
          fi

          if [ ! -f app/build.gradle.kts ] && [ ! -f app/build.gradle ]; then
            echo "ERRO: configuração Gradle da pasta app não encontrada."
            exit 1
          fi

          echo "Estrutura validada."

      - name: Compilar APK de depuração
        working-directory: ${{ steps.projeto.outputs.dir }}
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Verificar e preparar APK
        working-directory: ${{ steps.projeto.outputs.dir }}
        shell: bash
        run: |
          APK=$(find app/build/outputs/apk/debug \
            -type f -name "*.apk" 2>/dev/null | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            find . -type f -name "*.apk" -print
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/saida"
          cp "$APK" "$GITHUB_WORKSPACE/saida/QualiInsp-3.0.apk"

          echo "APK preparado:"
          ls -lh "$GITHUB_WORKSPACE/saida/QualiInsp-3.0.apk"

      - name: Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: QualiInsp-3.0-APK
          path: saida/QualiInsp-3.0.apk
          if-no-files-found: error
          retention-days: 14
